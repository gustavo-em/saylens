name: Feature request
description: Propose a focused product or technical capability
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user or engineering outcome, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this useful now, and which roadmap milestone does it support?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and trade-offs
      description: Note performance, Android, camera, privacy, or architecture implications.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing issue or ADR covering this request.
          required: true
